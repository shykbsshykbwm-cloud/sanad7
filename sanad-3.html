<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سند - نظام حماية الشركات من غرامات وزارة العمل قطر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';document.head.appendChild(s)"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';document.head.appendChild(s)"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js';document.head.appendChild(s)"></script>
<style>
:root{
  --maroon:#8A1538; --maroon-d:#650F29; --maroon-l:#F7E9EE;
  --bg:#EDEFF2; --card:#FFFFFF; --line:#DCE0E6; --text:#1B2430; --muted:#66727F; --head:#F6F7F9;
  --red:#C62828; --red-l:#FDECEC; --orange:#E65100; --amber-l:#FFF1DC; --yellow:#F2B705;
  --green:#2E7D32; --green-l:#E7F4E8;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'IBM Plex Sans Arabic','Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,select{font-family:inherit;font-size:inherit}
.num,.tnum,td,th{font-variant-numeric:tabular-nums}
svg.ic{flex:none;vertical-align:middle}

/* ---------- Login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr}
.login-brand{background:linear-gradient(155deg,var(--maroon) 0%,var(--maroon-d) 100%);color:#fff;padding:56px 56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-brand::after{content:"";position:absolute;inset-inline-end:-120px;bottom:-120px;width:380px;height:380px;border-radius:50%;border:56px solid rgba(255,255,255,.06)}
.login-brand h1{font-size:34px;line-height:1.35;margin:0 0 14px;font-weight:700;max-width:520px}
.login-brand p{margin:0;color:rgba(255,255,255,.8);max-width:480px}
.feat{display:flex;flex-direction:column;gap:14px;margin-top:34px}
.feat div{display:flex;gap:12px;align-items:center;color:rgba(255,255,255,.92)}
.feat span.b{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.14);display:grid;place-items:center}
.login-form-wrap{display:grid;place-items:center;padding:32px 20px;position:relative}
.login-card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:32px;box-shadow:0 8px 30px rgba(20,30,50,.06)}
.login-card h2{margin:0 0 4px;font-size:22px}
.tabs{display:flex;background:var(--head);border-radius:8px;padding:3px;margin-bottom:20px}
.tabs button{flex:1;border:0;background:transparent;padding:8px;border-radius:6px;font-weight:600;cursor:pointer;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--maroon);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.login-lang{position:absolute;top:18px;inset-inline-end:20px}
@media (max-width:860px){.login{grid-template-columns:1fr}.login-brand{padding:32px 24px}.login-brand h1{font-size:24px}.feat{display:none}}

/* ---------- Forms & buttons ---------- */
label.f{display:block;font-weight:600;margin-bottom:6px;font-size:13px}
.inp{width:100%;border:1px solid #C6CCD4;border-radius:8px;padding:10px 12px;background:#fff;color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--maroon);box-shadow:0 0 0 3px rgba(138,21,56,.14)}
.err{color:var(--red);font-size:12.5px;margin-top:6px;min-height:18px}
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;border:1px solid var(--maroon);background:var(--maroon);color:#fff;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer;transition:background .15s,transform .05s;white-space:nowrap}
.btn:hover{background:var(--maroon-d)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.nav a:focus-visible,.inp:focus-visible{outline:2px solid var(--maroon);outline-offset:2px}
.btn.ghost{background:#fff;color:var(--maroon)}
.btn.ghost:hover{background:var(--maroon-l)}
.btn.danger{background:#fff;color:var(--red);border-color:#E7B4B4}
.btn.danger:hover{background:var(--red-l)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.lg{padding:12px 20px;font-size:15px}
.btn.block{width:100%}
.iconbtn{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:6px;border-radius:6px}
.iconbtn:hover{background:var(--red-l);color:var(--red)}

/* ---------- Shell ---------- */
.shell{position:sticky;top:0;z-index:30;height:56px;background:var(--maroon);color:#fff;display:flex;align-items:center;gap:14px;padding-inline:20px;box-shadow:0 1px 0 rgba(0,0,0,.2)}
.shell .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.shell .sub{font-weight:400;opacity:.8;font-size:12.5px;border-inline-start:1px solid rgba(255,255,255,.3);padding-inline-start:12px;max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shell .sp{flex:1}
.shbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:8px;padding:6px 12px;display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-weight:500}
.shbtn:hover{background:rgba(255,255,255,.22)}
.layout{display:grid;grid-template-columns:232px 1fr;min-height:calc(100vh - 56px)}
.nav{background:#fff;border-inline-end:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:4px;position:sticky;top:56px;align-self:start;height:calc(100vh - 56px)}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;color:#394453;text-decoration:none;font-weight:500;border-inline-start:3px solid transparent;cursor:pointer}
.nav a:hover{background:var(--head)}
.nav a.on{background:var(--maroon-l);color:var(--maroon);border-inline-start-color:var(--maroon);font-weight:700}
.nav .foot{margin-top:auto;color:var(--muted);font-size:12px;padding:10px 12px;border-top:1px solid var(--line)}
main{padding:24px;min-width:0;max-width:1400px;width:100%}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .nav{position:sticky;top:56px;z-index:20;height:auto;flex-direction:row;overflow-x:auto;border-inline-end:0;border-bottom:1px solid var(--line);padding:8px 10px}
  .nav a{white-space:nowrap;border-inline-start:0;border-bottom:3px solid transparent;border-radius:6px}
  .nav a.on{border-bottom-color:var(--maroon)}
  .nav .foot{display:none}
  main{padding:16px}
  .shell .sub{display:none}
}

/* ---------- Page bits ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ph h2{margin:0;font-size:22px;font-weight:700}
.ph .d{color:var(--muted);font-size:13px;margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px}
.card .ch{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700}
.card .cb{padding:18px}
.muted{color:var(--muted)}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:16px;margin-bottom:18px}
.tile{border-radius:12px;padding:20px;color:#fff;min-height:178px;display:flex;flex-direction:column;justify-content:space-between;text-align:start;border:0;cursor:pointer;box-shadow:0 2px 6px rgba(20,30,50,.12);transition:transform .15s,box-shadow .15s;font-family:inherit}
.tile:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(20,30,50,.18)}
.tile .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.tile .lbl{font-weight:600;font-size:14.5px;line-height:1.4;max-width:75%}
.tile .ico{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.2);display:grid;place-items:center}
.tile .big{font-size:46px;font-weight:700;line-height:1.05;margin:10px 0 6px;letter-spacing:-.5px}
.tile .big small{font-size:16px;font-weight:600;opacity:.9;margin-inline-start:6px}
.tile .sub{font-size:12.5px;opacity:.92}
.t-red{background:linear-gradient(135deg,#D93636,#A91E1E)}
.t-orange{background:linear-gradient(135deg,#F7871C,#DB5A00)}
.t-yellow{background:linear-gradient(135deg,#FFD23F,#F2AC00);color:#2B2200}
.t-yellow .ico{background:rgba(0,0,0,.1)}
.t-maroon{background:linear-gradient(135deg,#9A1B42,#5E0E26)}

.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px;margin-bottom:16px}
@media (max-width:1000px){.grid2{grid-template-columns:1fr}}
.banner{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;border-radius:10px;margin-bottom:16px;border:1px solid}
.banner.red{background:var(--red-l);border-color:#F1B9B9;color:#8E1B1B}
.banner.green{background:var(--green-l);border-color:#B9DDBB;color:#1F5E23}
.banner.info{background:#fff;border-color:var(--line);color:var(--text)}
.banner b{font-weight:700}

.ring{display:grid;place-items:center;position:relative;width:150px;height:150px;margin:6px auto 12px}
.ring .v{position:absolute;text-align:center}
.ring .v b{font-size:34px;display:block;line-height:1}
.bars{display:flex;flex-direction:column;gap:11px}
.bar{display:grid;grid-template-columns:120px 1fr 40px;gap:10px;align-items:center;font-size:13px}
.bar .tr{background:#EEF0F3;border-radius:6px;height:14px;overflow:hidden}
.bar .fi{height:100%;border-radius:6px;min-width:0;transition:width .4s}
.bar .n{font-weight:700;text-align:end}

/* ---------- Tables ---------- */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;min-width:760px}
table.t th{background:var(--head);text-align:start;font-weight:700;font-size:12.5px;color:#4A5563;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:10px 12px;border-bottom:1px solid #EEF0F3;vertical-align:middle}
table.t tr:hover td{background:#FAFBFC}
table.t tr.risk td{background:#FFF8F8}
table.t tr.risk:hover td{background:#FFF1F1}
td.exp{background:var(--red-l)!important;color:var(--red);font-weight:700}
td.exp small{display:block;font-weight:500;font-size:11.5px}
td.soon{color:var(--orange);font-weight:600}
td.soon small{display:block;font-weight:500;font-size:11.5px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.red{background:var(--red-l);color:var(--red)}
.pill.amber{background:var(--amber-l);color:var(--orange)}
.pill.green{background:var(--green-l);color:var(--green)}
.pill.gray{background:#EEF0F3;color:#526070}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.toolbar .inp{width:auto;min-width:0}
.sbox{position:relative;flex:1 1 220px;min-width:180px}
.sbox svg{position:absolute;inset-inline-start:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.sbox .inp{padding-inline-start:36px;width:100%}
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty .eic{width:56px;height:56px;border-radius:14px;background:var(--maroon-l);color:var(--maroon);display:grid;place-items:center;margin:0 auto 12px}
.empty h3{color:var(--text);margin:0 0 4px;font-size:16px}
.pager{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}

.drop{border:2px dashed #C9A0AF;background:#FCF6F8;border-radius:12px;padding:24px;text-align:center;cursor:pointer;display:block;transition:background .15s,border-color .15s}
.drop:hover,.drop.over{background:var(--maroon-l);border-color:var(--maroon)}
.drop b{color:var(--maroon)}
.cols{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.cols span{background:#fff;border:1px solid var(--line);border-radius:6px;padding:2px 9px;font-size:12.5px}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.chip{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 16px;min-width:130px}
.chip b{display:block;font-size:22px;line-height:1.2}
.chip span{font-size:12.5px;color:var(--muted)}
.chip.r b{color:var(--red)} .chip.o b{color:var(--orange)} .chip.g b{color:var(--green)}

/* ---------- Modal / toast ---------- */
.ov{position:fixed;inset:0;background:rgba(20,26,36,.5);display:grid;place-items:center;z-index:80;padding:16px}
.md{background:#fff;border-radius:12px;width:100%;max-width:520px;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.md .mh{padding:16px 20px;border-bottom:1px solid var(--line);font-weight:700;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.md .mb{padding:20px}
.md .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
#toasts{position:fixed;bottom:18px;inset-inline-start:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:92vw}
[dir=rtl] #toasts{transform:translateX(50%);inset-inline-start:auto;right:50%}
.toast{background:#1B2430;color:#fff;border-radius:9px;padding:10px 16px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-weight:500;animation:up .2s ease}
.toast.ok{background:#1F6B2A}.toast.err{background:#B3261E}.toast.warn{background:#B45309}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- PDF report (rendered off-screen) ---------- */
#reportRoot{position:fixed;left:-12000px;top:0;width:794px;background:#fff;color:#1B2430;font-family:'IBM Plex Sans Arabic','Tajawal',sans-serif}
.rp{padding:0 0 28px}
.rp .hd{background:var(--maroon);color:#fff;padding:26px 36px;display:flex;justify-content:space-between;align-items:center}
.rp .hd h1{margin:0;font-size:22px}
.rp .hd small{opacity:.85;font-size:12.5px}
.rp .bd{padding:24px 36px}
.rp .meta{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:20px}
.rp .meta div{background:#F6F7F9;border-radius:8px;padding:10px 14px}
.rp .meta small{display:block;color:#66727F;font-size:11.5px}
.rp .meta b{font-size:14px}
.rp .kp{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.rp .kp div{border-radius:10px;padding:18px;color:#fff}
.rp .kp .a{background:#C62828}.rp .kp .b{background:var(--maroon)}
.rp .kp b{display:block;font-size:34px;line-height:1.1}
.rp h3{margin:18px 0 8px;font-size:15px;color:var(--maroon)}
.rp table{width:100%;border-collapse:collapse;font-size:12.5px}
.rp th{background:#F1F2F5;text-align:start;padding:7px 10px;border:1px solid #DCE0E6}
.rp td{padding:7px 10px;border:1px solid #DCE0E6}
.rp .note{margin-top:18px;font-size:11.5px;color:#66727F;border-top:1px solid #DCE0E6;padding-top:10px}
.rp .rd{color:#C62828;font-weight:700}
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="loginView" class="login" hidden>
  <div class="login-brand">
    <div style="display:flex;align-items:center;gap:12px;font-weight:700;font-size:20px" id="lbBrand"></div>
    <div>
      <h1 data-i18n="appTitle"></h1>
      <p data-i18n="loginHero"></p>
      <div class="feat" id="lbFeat"></div>
    </div>
    <div style="font-size:12.5px;opacity:.75" data-i18n="privacy"></div>
  </div>
  <div class="login-form-wrap">
    <button class="shbtn login-lang" style="background:#fff;color:var(--maroon);border-color:var(--line)" onclick="toggleLang()" id="lgLang"></button>
    <form class="login-card" id="loginForm" autocomplete="on" novalidate>
      <div class="tabs"><button type="button" id="tabIn" onclick="setMode('in')"></button><button type="button" id="tabUp" onclick="setMode('up')"></button></div>
      <h2 id="lgTitle"></h2>
      <p class="muted" style="margin:0 0 20px" id="lgSub"></p>
      <div id="fName" style="margin-bottom:14px"><label class="f" for="lgName" data-i18n="companyName"></label><input class="inp" id="lgName" maxlength="120" data-i18n-ph="phCompany" autocomplete="organization"></div>
      <div id="fEst" style="margin-bottom:14px"><label class="f" for="lgEst" data-i18n="estNo"></label><input class="inp" id="lgEst" maxlength="30" data-i18n-ph="phEst" dir="ltr" style="text-align:start"></div>
      <div style="margin-bottom:14px"><label class="f" for="lgEmail" data-i18n="lblEmail"></label><input class="inp" id="lgEmail" type="email" maxlength="120" dir="ltr" style="text-align:start" autocomplete="username"></div>
      <div style="margin-bottom:14px"><label class="f" for="lgPass" data-i18n="lblPass"></label><input class="inp" id="lgPass" type="password" maxlength="128" dir="ltr" style="text-align:start" autocomplete="current-password"></div>
      <div id="fPass2" style="margin-bottom:14px"><label class="f" for="lgPass2" data-i18n="lblPass2"></label><input class="inp" id="lgPass2" type="password" maxlength="128" dir="ltr" style="text-align:start" autocomplete="new-password"></div>
      <label style="display:flex;gap:8px;align-items:center;cursor:pointer;font-size:13px;margin-bottom:4px"><input type="checkbox" id="lgShow" onchange="togglePw(this.checked)"><span data-i18n="showPass"></span></label>
      <div class="muted" id="lgHint" style="font-size:12.5px;margin-top:6px"></div>
      <div class="err" id="lgErr" role="alert"></div>
      <button class="btn lg block" type="submit" id="lgBtn"></button>
    </form>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="appView" hidden>
  <header class="shell">
    <div class="brand" id="shBrand"></div>
    <div class="sub" id="shCompany"></div>
    <div class="sp"></div>
    <button class="shbtn" onclick="toggleLang()" id="shLang"></button>
    <button class="shbtn" onclick="logout()" id="shOut"></button>
  </header>
  <div class="layout">
    <nav class="nav" id="nav"></nav>
    <main id="main"></main>
  </div>
</div>

<div id="reportRoot"></div>
<div id="modalRoot"></div>
<div id="toasts"></div>

<script>
/* =====================================================================
   Sanad - Labor Ministry fine protection (Qatar)
   Pure HTML + Tailwind + JS. All data lives in LocalStorage.
   ===================================================================== */

/* ---------- i18n ---------- */
const D = {
  appName:['سند','Sanad'],
  tabIn:['دخول','Sign in'],tabUp:['حساب جديد','New account'],
  lblEmail:['البريد الإلكتروني','Email'],lblPass:['كلمة المرور','Password'],lblPass2:['تأكيد كلمة المرور','Confirm password'],showPass:['إظهار كلمة المرور','Show password'],
  inSub:['أدخل بريدك الإلكتروني وكلمة المرور.','Enter your email and password.'],
  upTitle:['إنشاء حساب للشركة','Create a company account'],upSub:['أنشئ حسابًا ببريد وكلمة مرور. بياناتك تُشفَّر على جهازك.','Create an account with an email and password. Your data is encrypted on your device.'],
  btnUp:['إنشاء الحساب','Create account'],
  errEmail:['أدخل بريدًا إلكترونيًا صحيحًا.','Enter a valid email address.'],
  errPass:['كلمة المرور 8 أحرف على الأقل وتحتوي حروفًا وأرقامًا.','Password must be at least 8 characters with letters and numbers.'],
  errPass2:['كلمتا المرور غير متطابقتين.','Passwords do not match.'],
  errExists:['يوجد حساب بهذا البريد. استخدم تبويب الدخول.','An account with this email already exists. Use the sign-in tab.'],
  errBad:['البريد أو كلمة المرور غير صحيحة.','Incorrect email or password.'],
  errLock:['محاولات كثيرة. انتظر {0} ثانية.','Too many attempts. Wait {0} seconds.'],

const pad = n => String(n).padStart(2, '0');
const mkIso = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
function validIso(y, m, d) {

  const dt = new Date(Date.UTC(y, m - 1, d));
  if (dt.getUTCMonth() !== m - 1) return null;
  return mkIso(y, m, d);
}
const toWestern = s => s.replace(/[٠-٩]/g, c => c.charCodeAt(0) - 1632).replace(/[۰-۹]/g, c => c.charCodeAt(0) - 1776);

function daysBetween(a, b) {

  return Math.round((Date.UTC(y2, m2 - 1, d2) - Date.UTC(y1, m1 - 1, d1)) / 864e5);
}
const daysLeft = iso => iso ? daysBetween(todayISO(), iso) : null;
const fmtDate = iso => { if (!iso) return ''; const [y, m, d] = iso.split('-'); return `${d}/${m}/${y}`; };

function parseDate(v) {

    return null;
  }
  const s = toWestern(String(v).trim());
  if (!s) return '';

  if (m) return validIso(+m[1], +m[2], +m[3]);
  m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/);

}

const norm = s => String(s == null ? '' : s).toLowerCase()

const ALIASES = {

    qid: ['رقم البطاقة', 'رقم البطاقه', 'رقم الهوية', 'رقم الاقامة', 'رقم الإقامة', 'البطاقة', 'qid', 'qatar id', 'id number', 'id no', 'id', 'card number'],
    idExp: ['تاريخ انتهاء البطاقة', 'تاريخ انتهاء الاقامة', 'تاريخ انتهاء الإقامة', 'انتهاء البطاقة', 'انتهاء الاقامة', 'id expiry', 'id expiry date', 'qid expiry', 'residency expiry', 'residence expiry'],
    healthExp: ['تاريخ انتهاء كرت الصحة', 'تاريخ انتهاء الكرت الصحي', 'تاريخ انتهاء البطاقة الصحية', 'انتهاء كرت الصحة', 'health card expiry', 'health expiry', 'health card expiry date'],
    contractExp: ['تاريخ انتهاء العقد', 'انتهاء العقد', 'contract expiry', 'contract end', 'contract expiry date']
  },
  wps: {

    qid: ['رقم البطاقة', 'رقم البطاقه', 'رقم الهوية', 'qid', 'id number', 'id'],
    amount: ['المبلغ', 'الراتب', 'صافي الراتب', 'amount', 'salary', 'net salary'],
    due: ['تاريخ الدفع', 'تاريخ الاستحقاق', 'تاريخ الراتب', 'payment date', 'pay date', 'due date', 'salary date'],

function mapColumns(rows, kind) {
  const spec = ALIASES[kind], keys = Object.keys(spec);
  const al = {}; keys.forEach(k => al[k] = spec[k].map(norm));
  let best = { score: 0, map: {}, row: 0 };
  rows.slice(0, 6).forEach((r, ri) => {
    const map = {};
    r.forEach((cell, ci) => { const n = norm(cell); if (!n) return; keys.forEach(k => { if (map[k] === undefined && al[k].includes(n)) map[k] = ci; }); });
    const score = Object.keys(map).length;
    if (score > best.score) best = { score, map, row: ri };
  });
  if (best.score >= 2) return { map: best.map, start: best.row + 1 };
  const map = {}; keys.forEach((k, i) => map[k] = i);
  return { map, start: 1 };
}
async function readSheet(file) {

  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    return XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
  } catch (e) { toast(t('readErr'), 'err'); return null; }
}

async function importWorkers(file) {

  let bad = 0, skipped = 0, added = 0, updated = 0;
  const list = mode === 'replace' ? [] : state.workers.slice();

  for (let i = start; i < rows.length; i++) {

/* ---------- analysis ---------- */
function wpsInfo(r) {
  if (!r.due) return { s: 'nodate', d: 0 };
  const today = todayISO();
  if (r.paid) { const d = daysBetween(r.due, r.paid); return d > 0 ? { s: 'paidlate', d } : { s: 'paid', d: 0 }; }
  const d = daysBetween(r.due, today);
  if (d > 0) return { s: 'late', d };
  if (d === 0) return { s: 'today', d: 0 };
  return { s: 'upcoming', d: -d };
}
function stats() {
  const W = state.workers, S = { idExp: 0, idSoon: 0, hExp: 0, hSoon: 0, cExp: 0, cSoon: 0, problem: 0, items: [] };
  W.forEach(w => {
    const a = docStatus(w.idExp), b = docStatus(w.healthExp), c = docStatus(w.contractExp);
    if (a === 'expired') S.idExp++; if (a === 'soon') S.idSoon++;
    if (b === 'expired') S.hExp++; if (b === 'soon') S.hSoon++;
    if (c === 'expired') S.cExp++; if (c === 'soon') S.cSoon++;
    if ([a, b, c].some(x => x === 'expired' || x === 'soon')) S.problem++;
    [['id', a, w.idExp], ['health', b, w.healthExp], ['contract', c, w.contractExp]].forEach(([ty, st, dt]) => {
      if (st === 'expired' || st === 'soon') S.items.push({ w, ty, st, dt, d: daysLeft(dt) });
    });
  });
  const late = state.wps.filter(r => wpsInfo(r).s === 'late');
  S.wpsLate = late.length;
  S.wpsLateAmt = late.reduce((a, r) => a + (r.amount || 0), 0);
  S.expired = S.idExp + S.hExp + S.cExp;
  S.soon = S.idSoon + S.hSoon + S.cSoon;
  S.violations = S.expired + S.soon + S.wpsLate;
  S.fine = S.violations * state.settings.fine;
  S.items.sort((x, y) => x.d - y.d);
  return S;
}

/* ---------- accounts & encryption (PBKDF2 + AES-GCM, all local) ---------- */
const te = new TextEncoder(), td = new TextDecoder();
function b64(buf) { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 8192) s += String.fromCharCode.apply(null, u.subarray(i, i + 8192)); return btoa(s); }

async function deriveKey(pw, salt) {
  const km = await crypto.subtle.importKey('raw', te.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 250000, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function encryptVault(key, json) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, te.encode(json));
  return { iv: b64(iv), ct: b64(ct) };
}
async function decryptVault(key, rec) {
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub64(rec.iv) }, key, ub64(rec.ct));
  return JSON.parse(td.decode(pt));
}
let session = null, saveChain = Promise.resolve();
function saveVault() {
  if (!session) return;
  const s = session, snap = JSON.stringify({ company: state.company, workers: state.workers, wps: state.wps, settings: state.settings });
  saveChain = saveChain.then(async () => {
    const rec = await encryptVault(s.key, snap);
    const acc = store.get('sanad_accounts', {});
    acc[s.email] = { salt: s.saltB64, iv: rec.iv, ct: rec.ct };
    store.set('sanad_accounts', acc);
  }).catch(() => {});
}
const validEmail = e => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e);
const validPass = p => p.length >= 8 && /[A-Za-z؀-ۿ]/.test(p) && /\d/.test(p);

let authMode = 'in', fails = 0, lockUntil = 0;
function setMode(m) { authMode = m; $('#lgErr').textContent = ''; renderLogin(); }
function renderLogin() {
  const up = authMode === 'up';

async function doLogin(e) {
  if (e) e.preventDefault();
  const err = $('#lgErr'); err.textContent = '';
  if (!(window.crypto && crypto.subtle)) { err.textContent = t('noCrypto'); return; }
  const email = $('#lgEmail').value.trim().toLowerCase(), pw = $('#lgPass').value;
  if (!validEmail(email)) { err.textContent = t('errEmail'); return; }
  if (authMode === 'up') {
    const name = $('#lgName').value.trim(), est = toWestern($('#lgEst').value.trim());
    if (name.length < 2) { err.textContent = t('errName'); return; }
    if (est.length < 1) { err.textContent = t('errEst'); return; }
    if (!validPass(pw)) { err.textContent = t('errPass'); return; }
    if (pw !== $('#lgPass2').value) { err.textContent = t('errPass2'); return; }
    if (store.get('sanad_accounts', {})[email]) { err.textContent = t('errExists'); return; }
    loginBusy(true);
    try {
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const key = await deriveKey(pw, salt);
      session = { email, key, saltB64: b64(salt) };
      state.company = { name, est }; state.workers = []; state.wps = []; state.settings = { fine: 10000, soon: 30 };
      saveVault(); await saveChain;
      if (!store.get('sanad_accounts', {})[email]) { session = null; state.company = null; err.textContent = t('noStore'); loginBusy(false); return; }
    } catch (x) { session = null; state.company = null; err.textContent = t('noCrypto'); loginBusy(false); return; }
    loginBusy(false);
  } else {
    if (Date.now() < lockUntil) { err.textContent = t('errLock', Math.ceil((lockUntil - Date.now()) / 1000)); return; }
    const rec = store.get('sanad_accounts', {})[email];
    loginBusy(true);
    try {
      const salt = rec ? ub64(rec.salt) : crypto.getRandomValues(new Uint8Array(16));
      const key = await deriveKey(pw, salt);
      if (!rec) throw new Error('nouser');
      const data = await decryptVault(key, rec);
      session = { email, key, saltB64: rec.salt };
      state.company = data.company; state.workers = data.workers || []; state.wps = data.wps || [];
      state.settings = Object.assign({ fine: 10000, soon: 30 }, data.settings || {});
      fails = 0;
    } catch (x) {

}

  return `
  <div class="ph"><div><h2>${t('dashTitle')}</h2><div class="d">${esc(state.company.name)} · ${t('estNo')}: <span class="num">${esc(state.company.est)}</span> · ${t('today')}: <span class="num">${fmtDate(todayISO())}</span></div></div>
    <button class="btn lg" onclick="makeReport()" id="btnReport">${ic('file', 18)}${t('dlReport')}</button></div>
  ${banner}${tiles}
  <div class="grid2">
    <div class="card"><div class="ch">${t('score')}</div><div class="cb" style="text-align:center">${ring}<div class="muted">${total ? t('scoreSub', okCount, total) : t('scoreNone')}</div></div></div>
    <div class="card"><div class="ch"><span>${t('dist')}</span><select class="inp" style="width:auto;padding:5px 10px" onchange="distType=this.value;render()" aria-label="${t('dist')}">
      <option value="idExp" ${key === 'idExp' ? 'selected' : ''}>${t('dId')}</option><option value="healthExp" ${key === 'healthExp' ? 'selected' : ''}>${t('dHealth')}</option><option value="contractExp" ${key === 'contractExp' ? 'selected' : ''}>${t('dContract')}</option></select></div>
      <div class="cb"><div class="bars">${bars}</div></div></div>
  </div>
  <div class="card" style="margin-bottom:16px"><div class="ch"><span>${t('attn')}</span>${S.items.length ? `<button class="btn sm ghost" onclick="go('workers','soonOrExpired')">${t('more')}</button>` : ''}</div>
    ${S.items.length ? `<div class="tw"><table class="t" style="min-width:560px"><thead><tr><th>${t('colName')}</th><th>${t('colStatus')}</th><th>${t('colIdExp').split(' ')[0]}</th><th></th></tr></thead><tbody>${att}</tbody></table></div>` : `<div class="empty" style="padding:28px">${t('attnNone')}</div>`}</div>
  <div class="muted" style="font-size:12.5px">${t('formula', win, fmt(state.settings.fine), qar)}</div>`;
}

function workerStatus(w) {
  const s = [docStatus(w.idExp), docStatus(w.healthExp), docStatus(w.contractExp)];
  if (s.includes('expired')) return 'bad';
  if (s.includes('soon')) return 'soon';
  if (s.every(x => x === 'none')) return 'none';
  return 'ok';
}
function filteredWorkers() {
  const q = norm(wf.q);
  return state.workers.filter(w => {
    if (q && !(norm(w.name).includes(q) || norm(w.qid).includes(q))) return false;
    const a = docStatus(w.idExp), b = docStatus(w.healthExp), c = docStatus(w.contractExp);
    switch (wf.f) {
      case 'anyExpired': return [a, b, c].includes('expired');
      case 'idExpired': return a === 'expired';
      case 'idRisk': return a === 'expired' || a === 'soon';
      case 'healthExpired': return b === 'expired';
      case 'contractExpired': return c === 'expired';
      case 'soonOrExpired': return [a, b, c].some(x => x === 'soon' || x === 'expired');
      case 'valid': return workerStatus(w) === 'ok';
      default: return true;
    }
  });
}
function dateCell(iso) {
  if (!iso) return '<td class="muted">—</td>';
  const s = docStatus(iso), d = daysLeft(iso);
  if (s === 'expired') return `<td class="exp"><span class="num" dir="ltr">${fmtDate(iso)}</span><small>${t('expAgo', -d)}</small></td>`;
  if (s === 'soon') return `<td class="soon"><span class="num" dir="ltr">${fmtDate(iso)}</span><small>${d === 0 ? t('expToday') : t('leftDays', d)}</small></td>`;
  return `<td><span class="num" dir="ltr">${fmtDate(iso)}</span></td>`;
}
function updateWorkersTable() {
  const box = $('#wTable'); if (!box) return;
  if (!state.workers.length) {
    box.innerHTML = `<div class="empty"><div class="eic">${ic('users', 26)}</div><h3>${t('wEmptyT')}</h3><div>${t('wEmptyD')}</div></div>`; return;
  }
  const list = filteredWorkers();
  const pages = Math.max(1, Math.ceil(list.length / wf.size)); if (wf.page > pages) wf.page = pages;
  const slice = list.slice((wf.page - 1) * wf.size, wf.page * wf.size);
  const pill = { bad: `<span class="pill red">${t('stBad')}</span>`, soon: `<span class="pill amber">${t('stSoon')}</span>`, ok: `<span class="pill green">${t('stOk')}</span>`, none: `<span class="pill gray">${t('stNone')}</span>` };
  const rows = slice.map((w, i) => `<tr class="${workerStatus(w) === 'bad' ? 'risk' : ''}">
    <td class="muted num">${(wf.page - 1) * wf.size + i + 1}</td><td><b>${esc(w.name || '—')}</b></td>
    <td class="num" dir="ltr" style="text-align:start">${esc(w.qid) || '—'}</td>${dateCell(w.idExp)}${dateCell(w.healthExp)}${dateCell(w.contractExp)}
    <td>${pill[workerStatus(w)]}</td><td><button class="iconbtn" title="${t('delete')}" aria-label="${t('delete')}" onclick="delWorker('${w.id}')">${ic('trash', 16)}</button></td></tr>`).join('');
  box.innerHTML = `<div class="tw"><table class="t"><thead><tr><th>#</th><th>${t('colName')}</th><th>${t('colQid')}</th><th>${t('colIdExp')}</th><th>${t('colHealth')}</th><th>${t('colContract')}</th><th>${t('colStatus')}</th><th></th></tr></thead>
    <tbody>${rows || `<tr><td colspan="8" class="empty">${t('noMatch')}</td></tr>`}</tbody></table></div>
    <div class="pager"><span>${t('showing', list.length, state.workers.length)}</span>
    <span style="display:flex;gap:8px;align-items:center"><button class="btn ghost sm" ${wf.page <= 1 ? 'disabled style="opacity:.4;cursor:default"' : ''} onclick="wf.page--;updateWorkersTable()">${t('prev')}</button><span class="num">${wf.page} / ${pages}</span><button class="btn ghost sm" ${wf.page >= pages ? 'disabled style="opacity:.4;cursor:default"' : ''} onclick="wf.page++;updateWorkersTable()">${t('next')}</button></span></div>`;
}
async function delWorker(id) {

function saveSettings() {
  const name = $('#stName').value.trim(), est = toWestern($('#stEst').value.trim());

  state.company = { name, est };
  state.settings = { fine, soon: win }; saveVault();
  $('#shCompany').textContent = name; toast(t('sSaved'), 'ok'); render();
}
function exportBackup() {
  const data = { app: 'sanad', version: 1, company: state.company, workers: state.workers, wps: state.wps, settings: state.settings };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: 'application/json' }));
  a.download = 'sanad-backup-' + todayISO() + '.json'; document.body.appendChild(a); a.click(); a.remove();
}
async function importBackup(file) {
  if (!file) return;
  try {
    const d = JSON.parse(await file.text());
    if (d.app !== 'sanad' || !Array.isArray(d.workers) || !Array.isArray(d.wps)) throw 0;
    state.workers = d.workers; state.wps = d.wps;
    if (d.settings) state.settings = Object.assign(state.settings, d.settings);
    saveVault();
    toast(t('restored'), 'ok'); render();
  } catch (e) { toast(t('badBackup'), 'err'); }
}
async function wipeAll() {
  if (!await ask(t('confirmWipe'))) return;
  const acc = store.get('sanad_accounts', {}); delete acc[session.email]; store.set('sanad_accounts', acc);
  logout();
}
async function changePassword() {
  const o = $('#cpOld').value, n = $('#cpNew').value, n2 = $('#cpNew2').value, err = $('#cpErr');
  err.textContent = '';
  if (!validPass(n)) { err.textContent = t('errPass'); return; }
  if (n !== n2) { err.textContent = t('errPass2'); return; }
  try {
    const rec = store.get('sanad_accounts', {})[session.email];
    await decryptVault(await deriveKey(o, ub64(rec.salt)), rec);
  } catch (e) { err.textContent = t('cpWrong'); return; }
  const salt = crypto.getRandomValues(new Uint8Array(16));
  session.key = await deriveKey(n, salt); session.saltB64 = b64(salt);
  saveVault(); await saveChain;
  ['cpOld', 'cpNew', 'cpNew2'].forEach(i => $('#' + i).value = '');
  toast(t('cpDone'), 'ok');
}

/* ---------- modal ---------- */
function openModal(title, body, foot) {
  $('#modalRoot').innerHTML = `<div class="ov" onclick="if(event.target===this)closeModal()"><div class="md" role="dialog" aria-modal="true"><div class="mh"><span>${title}</span><button class="iconbtn" onclick="closeModal()" aria-label="close" style="color:var(--muted)">${ic('x', 18)}</button></div><div class="mb">${body}</div>${foot ? `<div class="mf">${foot}</div>` : ''}</div></div>`;
}
function closeModal() { $('#modalRoot').innerHTML = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
function ask(msg) {
  return new Promise(res => {
    openModal(t('confirm'), `<div>${esc(msg)}</div>`, `<button class="btn ghost" id="askNo">${t('cancel')}</button><button class="btn danger" id="askYes">${t('confirm')}</button>`);
    $('#askNo').onclick = () => { closeModal(); res(false); };
    $('#askYes').onclick = () => { closeModal(); res(true); };
  });
}

/* ---------- PDF risk report ---------- */
async function makeReport() {
  if (typeof html2canvas === 'undefined' || !window.jspdf) { toast(t('libPdf'), 'err'); return; }
  const btn = $('#btnReport'); if (btn) btn.disabled = true;
  toast(t('rBusy'));
  const S = stats(), qar = t('qar'), win = state.settings.soon;
  const tyName = { id: t('iId'), health: t('iHealth'), contract: t('iContract') };
  /* one line per worker with issues */
  const byW = new Map();
  S.items.forEach(it => { const a = byW.get(it.w.id) || { w: it.w, list: [] }; a.list.push(it); byW.set(it.w.id, a); });
  const wrows = [...byW.values()];
  const LIM = 28;
  const rowsHtml = wrows.slice(0, LIM).map(x => `<tr><td>${esc(x.w.name || '—')}</td><td dir="ltr" style="text-align:start">${esc(x.w.qid) || '—'}</td><td>${x.list.map(it => `<span class="${it.st === 'expired' ? 'rd' : ''}">${tyName[it.ty]} ${it.st === 'expired' ? t('expiredWord') : t('soonWord')} (${fmtDate(it.dt)})</span>`).join(' · ')}</td></tr>`).join('');
  const brk = (label, e, s) => `<tr><td>${label}</td><td class="num">${e}</td><td class="num">${s}</td></tr>`;
  const root = $('#reportRoot');
  root.dir = lang === 'ar' ? 'rtl' : 'ltr';
  root.innerHTML = `<div class="rp">
    <div class="hd"><div><h1>${t('rTitle')}</h1><small>${t('appTitle')}</small></div><div style="display:flex;align-items:center;gap:8px;font-weight:700;font-size:20px">${LOGO(34)}${t('appName')}</div></div>
    <div class="bd">
      <div class="meta"><div><small>${t('rCompany')}</small><b>${esc(state.company.name)}</b></div><div><small>${t('rEst')}</small><b class="num">${esc(state.company.est)}</b></div><div><small>${t('rDate')}</small><b class="num">${fmtDate(todayISO())}</b></div></div>
      <div class="kp"><div class="a"><small>${t('rViol')}</small><b class="num">${fmt(S.violations)}</b></div><div class="b"><small>${t('rFine')}</small><b class="num">${fmt(S.fine)} ${qar}</b></div></div>
      <h3>${t('rBreak')}</h3>
      <table><thead><tr><th>${t('rType')}</th><th>${t('rExpired')}</th><th>${t('rSoon', win)}</th></tr></thead><tbody>
        ${brk(t('rRes'), S.idExp, S.idSoon)}${brk(t('rHealth'), S.hExp, S.hSoon)}${brk(t('rCon'), S.cExp, S.cSoon)}${brk(t('rWps'), S.wpsLate, '—')}
      </tbody></table>
      <h3>${t('rWorkers')}</h3>
      ${wrows.length ? `<table><thead><tr><th>${t('colName')}</th><th>${t('colQid')}</th><th>${t('rIssue')}</th></tr></thead><tbody>${rowsHtml}</tbody></table>${wrows.length > LIM ? `<div style="font-size:12px;margin-top:6px" class="muted">${t('rMoreRows', wrows.length - LIM)}</div>` : ''}` : `<div class="muted">${t('rNone')}</div>`}
      <div class="note">${t('rNote', fmt(state.settings.fine), qar)}</div>
    </div></div>`;
  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const canvas = await html2canvas(root.firstElementChild, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: 'pt', format: 'a4' });
    const pw = pdf.internal.pageSize.getWidth(), ph = pdf.internal.pageSize.getHeight();
    const imgH = canvas.height * pw / canvas.width, data = canvas.toDataURL('image/jpeg', 0.92);
    const pages = Math.max(1, Math.ceil(imgH / ph - 0.01));
    for (let i = 0; i < pages; i++) { if (i) pdf.addPage(); pdf.addImage(data, 'JPEG', 0, -i * ph, pw, imgH); }
    pdf.save('sanad-risk-report-' + todayISO() + '.pdf');
    toast(t('rDone'), 'ok');
  } catch (e) { toast(t('libPdf'), 'err'); }
  root.innerHTML = ''; if (btn) btn.disabled = false;
}

/* ---------- boot ---------- */
window.addEventListener('hashchange', () => { if (state.company) route(); });
authMode = Object.keys(store.get('sanad_accounts', {})).length ? 'in' : 'up';
applyI18n();
$('#loginView').hidden = false;
</script>
